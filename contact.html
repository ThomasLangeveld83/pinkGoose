<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact PinkGoose</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="container-header">
        <p><span id="Pink">pink</span> <span id="Goose">goose</span></p>
        <div class="top-knopjes">
            <a href="index.html">Home</a>
            <a href="learn.html">Learn</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
        <p id="login-button">login</p>
    </header>

    <section class="container">
        <h2> What's your GOOSE idea?</h2>
        <h2 id="lets-chat"> Let's chat and see how we can help</h2>

        <div class="email-containers container">
            <div class="email1 container">
                <img class="telegram-picture" src="afbeeldingen/Group 5531.png" alt="telegram icon" width="52"
                    height="52">
                <p class="brown bold">Telegram</p>
                <p class="brown">@superdao_team</p>
            </div>
            <div class="email2 container">
                <img class="telegram-picture" src="afbeeldingen/Group 5640.png" alt="email icon" width="52" height="52">
                <p class="purple bold"> email</p>
                <p class="purple">hello@superdao.co</p>
            </div>
        </div>
    </section>

    <section class="container-send-goose container">
        <div class="container-send-goose">
            <h2>Send a post goose</h2>

            <input type="email" id="email" name="email" placeholder="your email:" size="50" required>
            <input type="name" id="name" name="name" placeholder="your name:" size="50" required>
            <input type="your message" id="your-message" name="your message" placeholder="your message:" size="50"
                required>
            <input list="colors" name="colors" placeholder="Color of your goose" class="colors">
            <datalist id="colors">
                <option value="red">
                <option value="white">
                <option value="blue">
                <option value="black">
            </datalist>
            <input type="submit" value="send">
        </div>
    </section>

    <footer class="container-footer" container>
        <div class="footer-knopjes">
            <p class="bold">about</p>
            <p class="bold">jobs</p>
            <p class="yellow bold">legal</p>

            <img src="afbeeldingen/Frame.png" alt="twitter logo" width="28" height="28">
            <img src="afbeeldingen/Frame (1).png" alt="telegram logo" width="28" height="28">
            <img src="afbeeldingen/Frame (2).png" alt="youtube logo" width="28" height="28">
            <img src="afbeeldingen/Frame 5617.png" alt="discord logo" width="28" height="28">
        </div>

    </footer>
</body>

</html>
